server:
  port: 8080

spring:
  application:
    name: ats-analyzer
  security:
    user:
      name: admin
      password: admin123
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Google Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-1.5-flash
  base-url: https://generativelanguage.googleapis.com/v1beta/models

# Logging
logging:
  level:
    com.ats: INFO
    org.springframework.security: WARN
